name: Deploy to GitHub Pages

# Builds the static site (Next.js `output: "export"`) and publishes `out/`
# to GitHub Pages on every push to main. One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables → New variable:
#     SHEET_ID = <Google Sheet ID>   (optional — without it the site shows
#                                    the bundled snapshot data)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Project sites live under /<repo-name>/ on github.io.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SHEET_ID: ${{ vars.SHEET_ID }}

      # Pages runs Jekyll by default, which hides folders starting with "_"
      # (Next.js puts its JS/CSS in out/_next). This file turns that off.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
